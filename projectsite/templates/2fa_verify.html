{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two-Factor Authentication - Real's Food Products</title>
  <link rel="icon" type="image/png" href="{% static 'img/Reals_logo.png' %}">

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    .otp-input {
      font-size: 24px;
      text-align: center;
      letter-spacing: 12px;
      font-weight: 700;
      padding: 15px;
      margin: 20px 0;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Nunito', sans-serif;
    }
    .otp-input:focus {
      border-color: #4e7452;
      box-shadow: 0 0 0 3px rgba(78,116,82,0.15);
    }
    .info-box {
      background: #f0f7f0;
      border-left: 4px solid #4e7452;
      padding: 14px 16px;
      margin: 20px 0;
      border-radius: 6px;
      font-size: 14px;
      color: #444;
    }
    .info-box i {
      color: #4e7452;
      margin-right: 8px;
    }
    .resend-link {
      color: #4e7452;
      cursor: pointer;
      text-decoration: underline;
      font-weight: 600;
    }
    .resend-link:hover {
      color: #3a5c3e;
    }
    .cancel-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      background: transparent;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      color: #6b7280;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      text-align: center;
      text-decoration: none;
    }
    .cancel-btn:hover {
      background: #f3f4f6;
      color: #374151;
      text-decoration: none;
    }
    .expire-text {
      color: #9ca3af;
      font-size: 12px;
      margin-top: 10px;
      text-align: center;
    }
    .resend-text {
      color: #6b7280;
      font-size: 14px;
      text-align: center;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="login-container">

    <!-- Left Section — matches login/register exactly -->
    <div class="login-left">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="brand">
        <img src="{% static 'img/Reals_logo.png' %}" alt="Logo" class="brand-logo">
        <h1>🔐SECURE LOGIN</h1>
        <p>Two-Factor Authentication</p>
      </div>
    </div>

    <!-- Right Section -->
    <div class="login-right">
      <div class="form-wrapper">
        <h2>ENTER OTP CODE</h2>

        <div class="info-box">
          <i class="bi bi-envelope-check-fill"></i>
          <strong>Check your email!</strong><br>
          We've sent a 6-digit verification code to <strong>{{ user_email }}</strong>
        </div>

        <form method="post" action="{% url 'login' %}">
          {% csrf_token %}
          <input
            type="text"
            name="otp_code"
            class="otp-input"
            placeholder="0  0  0  0  0  0"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            required
            autofocus
          >

          <button type="submit" class="login-btn">
            <i class="bi bi-shield-check me-1"></i> Verify & Login
          </button>
        </form>

        <p class="resend-text">
          Didn't receive the code? <a href="{% url 'login' %}" class="resend-link">Try again</a>
        </p>
        <p class="expire-text">
          <i class="bi bi-clock"></i> Code expires in 5 minutes
        </p>

        <a href="{% url 'login' %}" class="cancel-btn">Cancel</a>

      </div>
    </div>

  </div>

  <script src="{% static 'js/core/jquery.3.2.1.min.js' %}"></script>
  <script src="{% static 'js/core/bootstrap.min.js' %}"></script>

  <script>
    // Only allow numeric input
    document.querySelector('.otp-input').addEventListener('input', function () {
      this.value = this.value.replace(/[^0-9]/g, '');
    });

    // Ripple effect on verify button (same as login)
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.querySelector('.login-btn');
      if (btn) {
        btn.addEventListener('click', function (e) {
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');
          const rect = btn.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          ripple.style.width  = size + 'px';
          ripple.style.height = size + 'px';
          ripple.style.left   = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top    = (e.clientY - rect.top  - size / 2) + 'px';
          btn.appendChild(ripple);
          setTimeout(() => ripple.remove(), 650);
        });
      }
    });
  </script>
</body>
</html>
