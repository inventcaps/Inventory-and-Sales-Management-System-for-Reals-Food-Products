{% extends 'base.html' %}
{% load static %}
{% load widget_tweaks %}

{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">
      <a href="{% url 'packaging-materials' %}" class="btn btn-link p-0 mr-2" title="Back to Packaging Materials">
        <i class="la la-arrow-left" style="font-size: 24px;"></i>
      </a>
      Packaging Materials
    </h4>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Edit Packaging Material</div>
          </div>

          <div class="card-body">
            <form method="post" enctype="multipart/form-data">
              {% csrf_token %}

              {% if form.errors %}
                <div class="alert alert-danger">
                  {{ form.errors }}
                </div>
              {% endif %}

              <div class="form-container">
                <div class="form-item">
                  <label>Category</label>
                  <input type="text" class="form-control" value="Packaging" readonly>
                  <input type="hidden" name="category" value="PACKAGING">
                </div>
                <div class="form-item">
                  <label>Name</label>
                  <input type="text" name="name" class="form-control" value="{{ form.name.value|default:'' }}" required>
                </div>

                <div class="form-item">
                  <label>Size</label>
                  <input type="number" step="0.01" name="size" class="form-control" value="{{ form.size.value|default:'' }}" required>
                </div>

                <div class="form-item">
                  <label>Unit</label>
                  <input type="text" name="unit" list="unit-options" class="form-control" value="{{ object.unit.unit_name|default:'' }}" required>
                  <datalist id="unit-options">
                    {% for su in size_units %}
                      <option value="{{ su.unit_name }}">
                    {% endfor %}
                  </datalist>
                </div>

                <div class="form-item">
                  <label>Price Per Unit</label>
                  <input type="number" step="0.01" name="price_per_unit" class="form-control" value="{{ form.price_per_unit.value|default:'' }}" required>
                </div>
              </div>

              <div class="form-actions btn-row mt-3">
                <button type="submit" class="btn btn-primary btn-rounded">Update</button>
              </div>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
{% endblock %}
