{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Real's Food Products{% endblock %}</title>
  <link rel="icon" type="image/png" href="{% static 'img/Reals_logo.png' %}">

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
  <div class="login-container">
    <!-- Left Section -->
    <div class="login-left">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="brand">
        <img src="{% static 'img/Reals_logo.png' %}" alt="Logo" class="brand-logo">
        <p>Please enter your email to reset your password.</p>
      </div>
    </div>

    <!-- Right Section -->
    <div class="login-right">
      <div class="form-wrapper">
        <h2>RESET PASSWORD</h2>
        <form method="post">
          {% csrf_token %}
          <input type="email" name="email" placeholder="Enter Email" required>

          {% if form.non_field_errors %}
            <div class="alert alert-danger">
              {% for error in form.non_field_errors %}
                <p>{{ error }}</p>
              {% endfor %}
            </div>
          {% endif %}

          <button type="submit" class="login-btn">Send Reset Link</button>
        </form>
        <p class="signup-text" style="margin-top:14px;">
          <a href="{% url 'login' %}" style="color:#5a855f; font-weight:700; text-decoration:none;">&#8592; Back to Login</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="{% static 'js/core/jquery.3.2.1.min.js' %}"></script>
  <script src="{% static 'js/core/bootstrap.min.js' %}"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const btn = document.querySelector('.login-btn');
      if (btn) {
        btn.addEventListener('click', function (e) {
          const ripple = document.createElement('span');
          ripple.classList.add('ripple');
          const rect = btn.getBoundingClientRect();
          const size = Math.max(rect.width, rect.height);
          ripple.style.width  = size + 'px';
          ripple.style.height = size + 'px';
          ripple.style.left   = (e.clientX - rect.left - size / 2) + 'px';
          ripple.style.top    = (e.clientY - rect.top  - size / 2) + 'px';
          btn.appendChild(ripple);
          setTimeout(() => ripple.remove(), 650);
        });
      }
    });
  </script>
</body>
</html>
