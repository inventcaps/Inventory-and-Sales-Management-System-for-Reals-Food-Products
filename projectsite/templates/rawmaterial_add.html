{% extends 'base.html' %}
{% load static %}
{% load widget_tweaks %}

{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">
      <a href="{% url 'rawmaterials-list' %}" class="btn btn-link p-0 mr-2" title="Back to Packaging Materials">
        <i class="la la-arrow-left" style="font-size: 24px;"></i>
      </a>
      Packaging Materials
    </h4>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Add New Packaging Material</div>
          </div>

          <div class="card-body">
              <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                {% if form.errors %}
                  <div class="alert alert-danger">
                    {{ form.errors }}
                  </div>
                {% endif %}

                <div class="form-container">
                  <!-- Name -->
                  <div class="form-item">
                    <label>Name</label>
                    <input type="text" name="name" class="form-control" value="{{ form.name.value|default:'' }}" placeholder="Enter Material" required>
                  </div>

                  <!-- Unit -->
                  <div class="form-item">
                    <label>Size Unit</label>
                    <select name="unit" class="form-control" id="unitSelect" required>
                      <option value="Grams" {% if form.unit.value|default:'Grams' == 'Grams' %}selected{% endif %}>Grams</option>
                      <option value="Centimeters" {% if form.unit.value == 'Centimeters' %}selected{% endif %}>Centimeters</option>
                    </select>
                  </div>

                  <!-- Size -->
                  <div class="form-item">
                    <label>Size</label>
                    <input type="number" step="0.01" name="size_number" class="form-control" id="sizeNumber" value="{{ form.size.value|default:'' }}" placeholder="Enter Size" required>
                    <input type="text" name="size_text" class="form-control" id="sizeText" value="{{ form.size.value|default:'' }}" placeholder="e.g. 12x14" pattern="^\d+(\.\d+)?x\d+(\.\d+)?$" style="display: none;">
                    <input type="hidden" name="size" id="sizeHidden" value="{{ form.size.value|default:'' }}">
                  </div>

                  <!-- Price Per Unit -->
                  <div class="form-item">
                    <label>Price Per Unit</label>
                    <input type="number" step="0.01" name="price_per_unit" class="form-control" value="{{ form.price_per_unit.value|default:'' }}" placeholder="Enter Price Per Unit" required>
                  </div>

                  <input type="hidden" name="category" value="PACKAGING">
                </div>

                <!-- Buttons -->
                <div class="form-actions btn-row mt-3">
                  <button type="submit" class="btn btn-primary btn-rounded">Save</button>
                </div>

              </form>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Duplication Warning Modal -->
<div class="modal fade" id="duplicationWarningModal" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="static" data-keyboard="false">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">⚠️ Duplicate Packaging Material Warning</h5>
        <button type="button" class="close" onclick="$('#duplicationWarningModal').modal('hide')" aria-label="Close">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p id="duplicationWarningMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="$('#duplicationWarningModal').modal('hide')">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="submitFormAnyway()">Yes, Add Anyway</button>
      </div>
    </div>
  </div>
</div>

<script>
  let allowFormSubmit = false;

  // Handle pre-submission duplication check
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    if (!form) return;

    // Handle unit selection change
    const unitSelect = document.getElementById('unitSelect');
    const sizeNumber = document.getElementById('sizeNumber');
    const sizeText = document.getElementById('sizeText');
    
    unitSelect.addEventListener('change', function() {
      if (this.value === 'Grams') {
        sizeNumber.style.display = 'block';
        sizeText.style.display = 'none';
        sizeNumber.required = true;
        sizeText.required = false;
      } else if (this.value === 'Centimeters') {
        sizeNumber.style.display = 'none';
        sizeText.style.display = 'block';
        sizeNumber.required = false;
        sizeText.required = true;
      }
    });

    // Initialize based on current selection
    unitSelect.dispatchEvent(new Event('change'));

    form.addEventListener('submit', function(e) {
      if (allowFormSubmit) {
        allowFormSubmit = false;
        return;
      }

      e.preventDefault();

      // Get form values
      const name = document.querySelector('input[name="name"]').value.trim();
      const unit = document.querySelector('select[name="unit"]').value.trim();
      const pricePerUnit = document.querySelector('input[name="price_per_unit"]').value.trim();
      
      // Get size from the appropriate input
      let size;
      if (unit === 'Grams') {
        size = sizeNumber.value.trim();
      } else {
        size = sizeText.value.trim();
      }

      // Check if all required fields are filled
      if (!name || !size || !unit || !pricePerUnit) {
        alert('Please fill in all required fields.');
        return;
      }

      // Copy the correct size value to the hidden field
      document.getElementById('sizeHidden').value = size;

      // Check for duplicates via API
      const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
      
      fetch('/api/check-rawmaterial-duplicates/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
          name: name,
          size: size,
          unit: unit,
          price_per_unit: pricePerUnit
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.duplicate) {
          // Show modal if duplicate found
          const messageElement = document.getElementById('duplicationWarningMessage');
          messageElement.textContent = `A packaging material with the same name (${name}), size (${size}), unit (${unit}), and price (₱${pricePerUnit}) already exists. Are you sure you want to add another one?`;
          $('#duplicationWarningModal').modal('show');
        } else {
          // No duplicate, submit form
          allowFormSubmit = true;
          form.submit();
        }
      })
      .catch(error => {
        console.error('Error checking duplicates:', error);
        // On error, allow submission to proceed
        allowFormSubmit = true;
        form.submit();
      });
    });

    // Handle post-submission errors (form validation errors)
    const alertDiv = document.querySelector('.alert-danger');
    if (alertDiv) {
      const errorText = alertDiv.innerText;
      // Check for any duplication-related errors
      if (errorText.includes('complete duplicate') || 
          errorText.includes('already used') || 
          errorText.includes('already exists') ||
          errorText.includes('Please complete all required fields')) {
        // Hide the alert
        alertDiv.style.display = 'none';
        
        // Show the modal with the error message
        const messageElement = document.getElementById('duplicationWarningMessage');
        if (messageElement) {
          messageElement.textContent = errorText;
        }
        
        // Show the modal using jQuery with a small delay to ensure jQuery is ready
        setTimeout(function() {
          $('#duplicationWarningModal').modal('show');
        }, 100);
      }
    }
  });

  function submitFormAnyway() {
    $('#duplicationWarningModal').modal('hide');
    allowFormSubmit = true;
    document.querySelector('form').submit();
  }
</script>
{% endblock %}
