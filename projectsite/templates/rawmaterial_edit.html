{% extends 'base.html' %}
{% load static %}
{% load widget_tweaks %}

{% block content %}
<div class="content">
  <div class="container-fluid">
    <h4 class="page-title">
      <a href="{% url 'rawmaterial-batch' %}" class="btn btn-link p-0 mr-2" title="Back to Raw Materials">
        <i class="la la-arrow-left" style="font-size: 24px;"></i>
      </a>
      Raw Materials
    </h4>
    <div class="row">
      <div class="col-md-12">
        <div class="card">
          <div class="card-header">
            <div class="card-title">Edit Raw Material</div>
          </div>

          <div class="card-body">
            <form method="post" enctype="multipart/form-data">
              {% csrf_token %}

              {% if form.errors %}
                <div class="alert alert-danger">
                  {{ form.errors }}
                </div>
              {% endif %}

              <div class="form-container">
                <!-- Name -->
                <div class="form-item">
                  <label>Name</label>
                  <input type="text" name="name" class="form-control" value="{{ form.name.value|default:'' }}" required>
                </div>

                <div class="form-item">
                  <label>Size</label>
                  <input type="number" step="0.01" name="size" class="form-control" value="{{ form.size.value|default:'' }}" required>
                </div>

                <div class="form-item">
                  <label>Unit</label>
                  <input type="text" name="unit" list="unit-options" class="form-control" value="{{ object.unit.unit_name|default:'' }}" required>
                  <datalist id="unit-options">
                    {% for su in size_units %}
                      <option value="{{ su.unit_name }}">
                    {% endfor %}
                  </datalist>
                </div>

                <div class="form-item">
                  <label>Price Per Unit</label>
                  <input type="number" step="0.01" name="price_per_unit" class="form-control" value="{{ form.price_per_unit.value|default:'' }}" required>
                </div>

                <input type="hidden" name="category" value="PACKAGING">
              </div>

              <div class="form-actions btn-row mt-3">
                  <button type="submit" class="btn btn-primary btn-rounded">Update</button>
                </div>

              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- Duplication Warning Modal -->
<div class="modal fade" id="duplicationWarningModal" tabindex="-1" role="dialog" aria-hidden="true" data-backdrop="static" data-keyboard="false">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">⚠️ Duplicate Raw Material Warning</h5>
        <button type="button" class="close" onclick="$('#duplicationWarningModal').modal('hide')" aria-label="Close">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <p id="duplicationWarningMessage"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="$('#duplicationWarningModal').modal('hide')">OK</button>
      </div>
    </div>
  </div>
</div>

<script>
  // Handle duplication warning modal
  document.addEventListener('DOMContentLoaded', function() {
    const alertDiv = document.querySelector('.alert-danger');
    if (alertDiv) {
      const errorText = alertDiv.innerText;
      // Check for any duplication-related errors
      if (errorText.includes('complete duplicate') || 
          errorText.includes('already used') || 
          errorText.includes('already exists') ||
          errorText.includes('Please complete all required fields')) {
        // Hide the alert
        alertDiv.style.display = 'none';
        
        // Show the modal with the error message
        const messageElement = document.getElementById('duplicationWarningMessage');
        if (messageElement) {
          messageElement.textContent = errorText;
        }
        
        // Show the modal using jQuery with a small delay to ensure jQuery is ready
        setTimeout(function() {
          $('#duplicationWarningModal').modal('show');
        }, 100);
      }
    }
  });
</script>
{% endblock %}
