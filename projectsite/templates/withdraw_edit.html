{% extends 'base.html' %} {% load static %} {% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">
            <a href="{% url 'withdrawals' %}" class="btn btn-link p-0 mr-2" title="Back to Withdrawals">
                <i class="la la-arrow-left" style="font-size: 24px;"></i>
            </a>
            Withdrawals
        </h4>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">Edit withdrawn Item
                            {% if is_raw_material %}
                                <span class="badge badge-info ml-2">Packaging Material</span>
                            {% else %}
                                <span class="badge badge-success ml-2">Product</span>
                            {% endif %}
                        </div>
                    </div>

                    <div class="card-body">
                        <form action="" method="post" novalidate>
                            {% csrf_token %} {% include 'includes/form.html' %}
                            
                            <datalist id="price_type_list">
                                <option value="UNIT">Unit Price</option>
                                <option value="SRP">Suggested Retail Price</option>
                            </datalist>
                            <div class="form-actions btn-row mt-3">
                                <button type="submit" class="btn btn-primary btn-rounded">Update</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const salesChannelField = document.querySelector('[name="sales_channel"]');
    const customerNameField = document.querySelector('[name="customer_name"]');
    const paymentStatusField = document.querySelector('[name="payment_status"]');
    const paidAmountField = document.querySelector('[name="paid_amount"]');
    const priceField = document.querySelector('[name="price_type_or_custom"]');
    const discountField = document.querySelector('[name="discount"]');
    const customDiscountField = document.querySelector('[name="custom_discount_value"]');
    const reasonField = document.querySelector('[name="reason"]');
    const form = priceField ? priceField.closest("form") : document.querySelector("form");
    
    // Check if this is a packaging material withdrawal
    const isRawMaterial = {{ is_raw_material|yesno:"true,false" }};
    
    // Debug logging
    console.log('Packaging Material Status:', isRawMaterial);
    console.log('Badge element:', document.querySelector('.badge'));

    // Function to hide/show a field's parent container
    function setFieldVisibility(field, visible) {
        if (!field) {
            console.log('Field not found:', field);
            return;
        }
        
        // Try multiple container selectors
        let container = field.closest('.field.item') || 
                      field.closest('.field') || 
                      field.closest('.form-group') ||
                      field.closest('div') ||
                      field.parentElement;
        
        if (container) {
            container.style.display = visible ? 'block' : 'none';
            console.log('Field visibility set:', field.name, 'visible:', visible, 'container:', container);
        } else {
            console.log('No container found for field:', field.name);
        }
    }

    // Alternative function to hide fields by adding/removing disabled and hidden attributes
    function hideFieldCompletely(field, hide) {
        if (!field) return;
        
        if (hide) {
            field.style.display = 'none';
            field.disabled = true;
            field.required = false;
            // Also hide the label if it exists
            const label = document.querySelector(`label[for="${field.id}"]`) || 
                         document.querySelector(`label[for="${field.name}"]`);
            if (label) {
                label.style.display = 'none';
            }
        } else {
            field.style.display = '';
            field.disabled = false;
            const label = document.querySelector(`label[for="${field.id}"]`) || 
                         document.querySelector(`label[for="${field.name}"]`);
            if (label) {
                label.style.display = '';
            }
        }
    }

    // Function to update field visibility based on current selections
    function updateFieldVisibility() {
        const reason = reasonField ? reasonField.value : "";
        const salesChannel = salesChannelField ? salesChannelField.value : "";
        const paymentStatus = paymentStatusField ? paymentStatusField.value : "";
        
        // Packaging material logic
        if (isRawMaterial) {
            console.log('Hiding fields for packaging material...');
            
            // Use both methods to ensure fields are hidden
            setFieldVisibility(salesChannelField, false);
            setFieldVisibility(customerNameField, false);
            setFieldVisibility(paymentStatusField, false);
            setFieldVisibility(paidAmountField, false);
            setFieldVisibility(priceField, false);
            setFieldVisibility(discountField, false);
            setFieldVisibility(customDiscountField, false);
            
            // Backup method - hide fields directly
            hideFieldCompletely(salesChannelField, true);
            hideFieldCompletely(customerNameField, true);
            hideFieldCompletely(paymentStatusField, true);
            hideFieldCompletely(paidAmountField, true);
            hideFieldCompletely(priceField, true);
            hideFieldCompletely(discountField, true);
            hideFieldCompletely(customDiscountField, true);
            
            return;
        }
        
        // Product logic
        if (reason !== 'SOLD') {
            // Not sold - hide all sales-related fields
            setFieldVisibility(salesChannelField, false);
            setFieldVisibility(customerNameField, false);
            setFieldVisibility(paymentStatusField, false);
            setFieldVisibility(paidAmountField, false);
            setFieldVisibility(priceField, false);
            setFieldVisibility(discountField, false);
            setFieldVisibility(customDiscountField, false);
            return;
        }
        
        // Reason is SOLD
        setFieldVisibility(salesChannelField, true);
        
        // Check sales channel
        const isOrderChannel = ['ORDER', 'CONSIGNMENT', 'RESELLER'].includes(salesChannel);
        
        if (isOrderChannel) {
            // ORDER/CONSIGNMENT/RESELLER
            setFieldVisibility(customerNameField, true);
            setFieldVisibility(paymentStatusField, true);
            
            // Check payment status
            if (paymentStatus === 'PAID') {
                setFieldVisibility(priceField, true);
                setFieldVisibility(paidAmountField, false);
                
                // Check if custom price or unit/srp
                const priceValue = priceField ? priceField.value.trim().toUpperCase() : "";
                const isCustomPrice = priceValue && priceValue !== 'UNIT' && priceValue !== 'SRP';
                setFieldVisibility(discountField, !isCustomPrice);
                setFieldVisibility(customDiscountField, !isCustomPrice);
            } else if (paymentStatus === 'PARTIAL') {
                setFieldVisibility(priceField, false);
                setFieldVisibility(paidAmountField, true);
                setFieldVisibility(discountField, false);
                setFieldVisibility(customDiscountField, false);
            } else if (paymentStatus === 'UNPAID') {
                setFieldVisibility(priceField, false);
                setFieldVisibility(paidAmountField, false);
                setFieldVisibility(discountField, false);
                setFieldVisibility(customDiscountField, false);
            }
        } else {
            // PHYSICAL_STORE or other channels
            setFieldVisibility(customerNameField, false);
            setFieldVisibility(paymentStatusField, false);
            setFieldVisibility(paidAmountField, false);
            setFieldVisibility(priceField, true);
            
            // Check if custom price
            const priceValue = priceField ? priceField.value.trim().toUpperCase() : "";
            const isCustomPrice = priceValue && priceValue !== 'UNIT' && priceValue !== 'SRP';
            setFieldVisibility(discountField, !isCustomPrice);
            setFieldVisibility(customDiscountField, !isCustomPrice);
        }
    }

    // Add event listeners
    if (reasonField) reasonField.addEventListener('change', updateFieldVisibility);
    if (salesChannelField) salesChannelField.addEventListener('change', updateFieldVisibility);
    if (paymentStatusField) paymentStatusField.addEventListener('change', updateFieldVisibility);
    if (priceField) priceField.addEventListener('input', updateFieldVisibility);
    
    // Initial update
    updateFieldVisibility();
    
    // Backup execution after a short delay to ensure DOM is fully loaded
    setTimeout(function() {
        console.log('Backup execution - checking packaging material status again...');
        if (isRawMaterial) {
            console.log('Backup: Hiding fields for packaging material...');
            
            // Force hide using CSS classes
            const fieldsToHide = [
                '[name="sales_channel"]',
                '[name="customer_name"]', 
                '[name="payment_status"]',
                '[name="paid_amount"]',
                '[name="price_type_or_custom"]',
                '[name="discount"]',
                '[name="custom_discount_value"]'
            ];
            
            fieldsToHide.forEach(selector => {
                const field = document.querySelector(selector);
                if (field) {
                    // Hide the field and its container
                    field.style.display = 'none !important';
                    field.disabled = true;
                    field.required = false;
                    
                    // Find and hide parent containers
                    let parent = field.parentElement;
                    while (parent && parent !== document.body) {
                        if (parent.classList.contains('field') || 
                            parent.classList.contains('form-group') ||
                            parent.tagName === 'TR' || 
                            parent.tagName === 'TD') {
                            parent.style.display = 'none';
                            break;
                        }
                        parent = parent.parentElement;
                    }
                    
                    console.log('Backup: Hidden field', selector);
                }
            });
        }
    }, 500);

    function isNumeric(value) {
        return !isNaN(value) && value.trim() !== "";
    }

    form.addEventListener("submit", function (e) {
        // Skip validation for packaging materials
        if (isRawMaterial) {
            return true;
        }
        
        const reasonValue = reasonField ? reasonField.value : "";
        
        // Only validate price if reason is SOLD
        if (reasonValue === "SOLD") {
            const paymentStatus = paymentStatusField ? paymentStatusField.value : "";
            const salesChannel = salesChannelField ? salesChannelField.value : "";
            
            // Validate based on payment status
            if (paymentStatus === 'PAID') {
                const priceValue = priceField ? priceField.value.trim().toUpperCase() : "";
                if (
                    priceValue === "" ||
                    (!isNumeric(priceValue) && priceValue !== "UNIT" && priceValue !== "SRP")
                ) {
                    e.preventDefault();
                    alert("Please enter a valid price or select UNIT/SRP.");
                    if (priceField) priceField.focus();
                    return false;
                }
            } else if (paymentStatus === 'PARTIAL') {
                const paidAmount = paidAmountField ? paidAmountField.value : "";
                if (!paidAmount || parseFloat(paidAmount) <= 0) {
                    e.preventDefault();
                    alert("Please enter a valid paid amount for partial payment.");
                    if (paidAmountField) paidAmountField.focus();
                    return false;
                }
            }
        }
    });
});
</script>

<!-- CSS to force hide sales fields for packaging materials -->
{% if is_raw_material %}
<style>
/* Force hide sales-related fields for packaging materials */
[name="sales_channel"],
[name="customer_name"], 
[name="payment_status"],
[name="paid_amount"],
[name="price_type_or_custom"],
[name="discount"],
[name="custom_discount_value"] {
    display: none !important;
}

/* Hide parent containers that might contain these fields */
[name="sales_channel"] ~ *,
[name="customer_name"] ~ *,
[name="payment_status"] ~ *,
[name="paid_amount"] ~ *,
[name="price_type_or_custom"] ~ *,
[name="discount"] ~ *,
[name="custom_discount_value"] ~ * {
    display: none !important;
}

/* Hide table rows or form groups containing these fields */
tr:has([name="sales_channel"]),
tr:has([name="customer_name"]),
tr:has([name="payment_status"]),
tr:has([name="paid_amount"]),
tr:has([name="price_type_or_custom"]),
tr:has([name="discount"]),
tr:has([name="custom_discount_value"]),
.form-group:has([name="sales_channel"]),
.form-group:has([name="customer_name"]),
.form-group:has([name="payment_status"]),
.form-group:has([name="paid_amount"]),
.form-group:has([name="price_type_or_custom"]),
.form-group:has([name="discount"]),
.form-group:has([name="custom_discount_value"]) {
    display: none !important;
}
</style>
{% endif %}

{% endblock %}
